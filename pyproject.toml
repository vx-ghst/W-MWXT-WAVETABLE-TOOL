[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "W-MWXT-WAVETABLE-TOOL"
version = "0.7.0"
description = "wave and wavetable engineering toolkit for the Waldorf Microwave XT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "soundfile>=0.13,<1",
]
authors = [{name = "R-MiT"}]
license = {text = "Private project"}
keywords = [
  "Waldorf",
  "Microwave XT",
  "SysEx",
  "MIDI",
  "wave",
  "wavetable",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
W-MWXT-WAVETABLE-TOOL = "w_mwxt_wavetable_tool.cli:main"
W-MWXT-XT-GATE = "w_mwxt_wavetable_tool.xt_gate_cli:main"
W-MWXT-XT-AUDIO-GATE = "w_mwxt_wavetable_tool.xt_audio_gate_cli:main"
W-MWXT-XT-PROJECT = "w_mwxt_wavetable_tool.xt_projection_cli:main"
W-MWXT-XT-TRAJECTORY = "w_mwxt_wavetable_tool.xt_trajectory_cli:main"
W-MWXT-XT-QC = "w_mwxt_wavetable_tool.xt_trajectory_qc_cli:main"
W-MWXT-XT-PACKAGE = "w_mwxt_wavetable_tool.xt_package_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
