[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "W-MWXT-WAVETABLE-TOOL"
version = "0.1.0"
description = "wave and wavetable engineering toolkit for the Waldorf Microwave XT."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "R-MiT"}]
license = {text = "Private project"}
keywords = [
  "Waldorf",
  "Microwave XT",
  "SysEx",
  "MIDI",
  "wave",
  "wavetable",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
W-MWXT-WAVETABLE-TOOL = "w_mwxt_wavetable_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
